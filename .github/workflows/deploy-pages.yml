name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Playwright tests
        run: npm test

      - name: Prepare pages artifact
        env:
          # maccount SSO worker base URL, injected into js/cloud-config.js by
          # scripts/inject-env.mjs. Set as a repo Actions *variable* (non-secret):
          #   Settings > Secrets and variables > Actions > Variables >
          #   MACCOUNT_WORKER_URL = https://maccount-api.skhuang.workers.dev
          # If unset, cloud-config gets a blank URL and the auth client falls
          # back to its unconfigured stub (sign-in disabled). See docs/deploy-auth.md.
          MACCOUNT_WORKER_URL: ${{ vars.MACCOUNT_WORKER_URL }}
        run: npm run pages:artifact

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
